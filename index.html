群体通过资格、关系或规则限制外部人进入资源和机会。`,`行业过度依赖内部推荐，可能以信任之名持续排除没有既有人脉的合格者。`,`这道门槛是在验证必要能力，还是在保护既得群体对机会的控制？`],[`道德经济`,`Moral Economy`,`社会学`,`人们会用公平、义务和正当性的共同观念评价经济行为。`,`灾害期间商品大幅涨价即使符合供需，也可能因违背社区公平预期引发强烈抵制。`,`这项交易在法律和价格上成立，但是否越过了群体认可的正当性边界？`],[`保证责任`,`Guarantee Liability`,`法律常识`,`保证人依约在债务人不履行到期债务等情形下承担相应责任，方式与范围需具体判断。`,`朋友请你在借款文件上作为保证人签字时，应先确认保证方式、范围、期间及主债务内容。`,`我理解自己保证的具体债务、责任方式、范围和期间吗？`],[`合同解除`,`Contract Termination`,`法律常识`,`符合法律规定或约定条件时，使尚未履行的合同关系终止，既有责任不当然消失。`,`对方延期并不必然允许立即解除，应结合合同目的、催告、约定条件和实际违约程度判断。`,`我们拥有明确的解除依据并完成必要通知，还是只是不想继续合作？`],[`证据保全`,`Evidence Preservation`,`法律常识`,`证据可能灭失或以后难以取得时，依法采取措施固定其状态和内容。`,`网页内容、设备故障或现场痕迹可能迅速变化，仅自行截图未必足以完整证明。`,`哪项关键证据正在消失，我们需要用什么合法方式及时固定其来源与完整性？`],[`消费者知情权`,`Consumer Right to Know`,`法律常识`,`消费者有权依法了解商品或服务的真实情况，以便作出自主选择。`,`销售不能只突出低价而隐去自动续费、重要限制或与安全有关的关键信息。`,`这项信息是否足以改变普通消费者的购买决定，却被放在难以发现的位置？`],[`反例法`,`Counterexample`,`哲学`,`用一个满足前提却不满足结论的实例，证明普遍命题不成立。`,`有人声称所有高增长公司都亏损，只需找到一家高增长且盈利的公司即可推翻这个全称命题。`,`哪个最小而清晰的反例，足以迫使我收窄或放弃当前主张？`],[`循环论证`,`Circular Reasoning`,`哲学`,`论证把需要证明的结论以另一种形式预先放进前提。`,`说某制度正确因为它符合正确规则，而规则正确又因为制度认可它，并未提供外部理由。`,`我的理由如果离开结论本身，还能独立成立吗？`],[`自然主义谬误`,`Naturalistic Fallacy`,`哲学`,`不能仅因某事自然存在或普遍发生，就推出它在道德上应当如此。`,`竞争在自然界普遍存在，并不能直接证明组织应该接受任何残酷竞争方式。`,`我是否把‘自然或常见’偷偷替换成了‘正当或值得追求’？`],[`诠释学循环`,`Hermeneutic Circle`,`哲学`,`理解部分依赖整体，理解整体又需要不断返回各个部分修正。`,`读战略文件时，单句含义取决于整体目标，而整体目标也要通过具体措辞逐步确认。`,`新的局部证据如何改变我对整体的理解，整体预期又怎样影响我阅读局部？`],[`多效性`,`Pleiotropy`,`生物学`,`同一个基因可能影响多个看似不同的性状。`,`筛选某项有利特征时，相关基因也可能同时带来意外的健康或发育代价。`,`改变一个因素后出现多个结果，是多条独立机制，还是同一原因的多重效应？`],[`频率依赖选择`,`Frequency-dependent Selection`,`生物学`,`某种特征的适应优势会随其在种群中的常见程度改变。`,`稀有策略可能因竞争少而获益，但普及后优势消失，生态平衡因此保持多样性。`,`这项优势是内在稳定的，还是只在采用者仍然稀少时成立？`],[`适应度景观`,`Fitness Landscape`,`生物学`,`用地形比喻不同性状组合在特定环境中的繁殖成功差异。`,`种群可能停在局部高峰，因为到达更高适应峰必须先经历短期劣势。`,`当前方案是全局最佳，还是被短期下降阻挡在一个局部高峰？`],[`生态位构建`,`Niche Construction`,`生物学`,`生物不仅适应环境，也会主动改变环境并影响后续选择压力。`,`蚯蚓改变土壤、河狸筑坝，人类制度与技术也持续重塑自身生存条件。`,`我们是在适应既有环境，还是正在创造一个未来会反过来塑造我们的环境？`]],g={净现值:`先按资金的机会成本折现各期现金流，再与今天的投入相减；它回答项目是否额外创造价值，而不只是最终能收回多少钱。`,内部收益率:`它是令全部现金流现值恰好抵消初始投入的折现率。项目规模不同或现金流多次变号时，只按这一比例排序可能误导。`,分散化:`把资金放进驱动因素不同的资产，可以让一种风险发生时不至于全盘受损；持有很多高度相关的资产并不算真正分散。`,有效前沿:`它把可选组合中那些“同风险回报更高、同回报风险更低”的方案连成边界，边界以内的组合意味着仍有改进空间。`,资本资产定价模型:`该模型把不可通过分散消除的市场风险与必要回报联系起来，适合估算资金成本，但依赖市场有效等较强假设。`,贝塔系数:`贝塔比较资产收益对市场变动的平均反应幅度，描述的是系统性暴露；它不直接等于总风险，也不保证未来保持稳定。`,阿尔法:`先扣除基准市场和既定风险因子能解释的收益，剩余部分才叫阿尔法；短期为正也可能只是运气而非持续能力。`,波动率:`它统计收益上下摆动的幅度，把不确定性压缩成一个尺度；方向相反的涨跌都会增加波动，所以它不等同于永久亏损。`,久期:`久期把债券各期现金流的时间分布压成利率敏感度。利率小幅变化时，久期越长，价格反向变化通常越明显。`,收益率曲线:`它同时展示不同期限借款的市场价格，形状综合反映通胀、增长、政策和期限补偿预期，并非单一的衰退预言。`,通货膨胀:`它指广泛商品与服务价格持续抬升，而不是某件商品一次涨价；名义收入不变时，实际可购买的东西会减少。`,通货紧缩:`价格普遍下行会提高债务的实际负担，并诱使消费与投资延后；它并非“所有东西更便宜”这么简单。`,滞胀:`产出疲弱与物价上涨同时出现，使刺激需求和压低通胀两项目标互相牵制，常由供给冲击等因素触发。`,套利:`套利同时买入低价市场、卖出高价市场来锁定价差。只有扣除手续费、时间和履约风险后仍成立，才接近无风险。`,杠杆:`杠杆用固定偿付义务换取更大的资产敞口，因此收益和亏损都按更大的基数变化；真正危险常来自被迫在低点平仓。`,卖空:`卖空者先借货卖出，之后必须买回归还。由于价格上涨没有理论上限，判断方向正确也可能因时间和保证金先撑不住。`,衍生品:`衍生品把价格、利率或信用等风险拆成可交易合约，可用于转移风险，也能以较小本金形成很大的风险敞口。`,期权:`买方支付权利金获得选择权，最差可放弃行权；卖方收取权利金却承担履约义务，因此双方的收益结构并不对称。`,期货:`双方今天约定未来交割价格，并通过保证金和每日结算管理履约。它既能锁定成本，也可能因杠杆造成追加保证金。`,套期保值:`保值的目标是用另一项头寸抵消核心业务的价格风险，而不是多赚一笔；对冲关系不完全时仍会留下基差风险。`,信用利差:`它是承担发行人信用风险所多要求的收益，既会随偿债能力变化，也受流动性和市场恐慌影响。`,违约风险:`判断重点是借款人在约定时间能否产生并交付现金，而非账面资产看起来多少；回收顺序也会改变损失大小。`,道德风险:`当行为后果由别人承担时，行动者会减少防范或增加冒险。问题来自激励结构改变，不必以当事人恶意为前提。`,逆向选择:`交易前的信息差会让风险较高的一方更积极参与，最终把优质参与者挤出；它发生在签约前，区别于签约后的道德风险。`,行为金融:`它把有限理性、情绪和群体互动纳入市场解释，说明价格偏离价值的过程，但不意味着偏差一定容易被套利消除。`,可得性启发:`大脑会拿回忆的流畅程度替代真实频率，近期、鲜明或情绪强烈的事件因此被高估。容易想起不等于更常发生。`,代表性启发:`人会看个案像不像某种典型形象，却跳过该类别原本有多常见。相似性是线索，不是概率本身。`,光环效应:`一个醒目的优点会向无关维度扩散，使我们在缺乏证据时也给出一致的好评价；负面特征同样会产生反向光环。`,框架效应:`表达方式先设定参照点，再改变人对得失和风险的感受。数值等价的说法并不一定带来等价的选择。`,沉没成本谬误:`过去已经无法收回的投入不应进入下一步比较。继续与否只取决于从现在开始的新增成本、收益和替代机会。`,现状偏误:`维持默认选项会省去比较、行动和承担责任的成本，因此现状常被错误地当成更安全；不行动本身也是一种选择。`,近因效应:`序列末尾的信息在工作记忆里更鲜明，容易压过更早但同样重要的证据；时间间隔和是否立即回忆会改变其强度。`,首因效应:`最先获得的信息会搭起解释框架，后来材料往往被塞进这个框架。它影响的是信息整合顺序，不代表第一印象更准确。`,自利偏差:`人倾向把成功归给能力，把失败归给环境，以保护自我评价。长期如此会让复盘失真，也妨碍识别可改进之处。`,后见之明偏差:`知道结果后，大脑会重写当初的不确定感，让结局显得早有预兆。应以事前记录判断质量，而非只用结果倒推。`,社会认同:`不确定时，人会把他人的选择当作“什么是正确”的证据。群体行为可能提供信息，也可能只是彼此复制。`,认知失调:`行为、信念或自我形象互相冲突会产生不适，人常通过改写理由来恢复一致，而不一定真正修正行为。`,习得性无助:`多次经历无法控制的负面结果后，人可能停止尝试，后来即使出现可改变的机会也看不见；关键是重新建立行动与结果的联系。`,成长型思维:`它把能力视为可通过有效练习和反馈改变的系统，而非只靠“相信自己”。努力方法错误时，重复投入并不会自动成长。`,心流:`技能与挑战大致匹配、目标清楚且反馈及时，会让注意力高度集中。难度太低会无聊，太高则容易焦虑。`,内在动机:`行动本身带来的兴趣、掌握感或意义驱动持续投入。它可以与奖励并存，但控制感过强的奖励可能挤压自主性。`,外在动机:`行为由报酬、评价或惩罚等外部后果推动，适合启动明确任务，却未必能维持创造性和长期认同。`,心理安全感:`成员相信暴露问题、承认不知道或提出异议不会遭受人际惩罚。它保护坦诚，不取消专业标准和结果责任。`,依恋类型:`早期关系经验会形成对亲密与回应的倾向性预期，但类型不是终身身份；后续稳定关系也能改变互动模式。`,投射:`人把自己难以承认的情绪或动机归到别人身上，于是把内部冲突体验成外部事实。判断仍需寻找对方行为证据。`,安慰剂效应:`治疗期待、仪式和医患互动能改变主观感受乃至部分生理反应，但这不证明无效成分能替代必要治疗。`,习惯化:`同一刺激反复出现且没有重要后果时，反应会逐渐减弱，这是节省注意资源的学习过程，不等同于感官疲劳。`,单纯曝光效应:`在没有强烈负面体验时，反复接触会提高熟悉感，熟悉又常被误读为喜欢或可信；次数过多也会厌倦。`,选择过载:`选项增加会同时抬高比较成本、后悔空间和放弃概率。关键不是选项越少越好，而是结构是否帮助有效筛选。`,规划谬误:`人做计划时聚焦顺利完成任务的内部剧本，却忽略类似项目的实际分布，因此系统性低估工期、成本和障碍。`,价值主张:`它明确为哪类客户解决什么重要问题、带来何种可验证收益，以及为何比替代方案更值得选，不是一句品牌口号。`,商业模式:`它说明价值如何被创造、交付并转化为可持续收入，必须同时回答客户、成本、渠道和现金流如何彼此咬合。`,获客成本:`应把一段时期全部销售与营销投入分摊到真正新增的客户上，并与回收期和客户价值配套判断。`,客户终身价值:`它估计一位客户在完整关系期内贡献的毛利现值，而非销售额；留存、毛利和折现假设都会显著改变结果。`,流失率:`它衡量客户或收入在一定时期内离开的比例。客户流失和收入流失口径不同，也不能脱离观察周期比较。`,留存率:`留存关注一批用户经过时间后仍在使用或付费的比例，比新增规模更接近产品是否持续解决问题。`,同期群分析:`把同一时间或同一来源进入的用户放在一起追踪，能把生命周期变化与整体用户结构变化区分开。`,转化漏斗:`它把目标行为拆成连续步骤，定位人在哪一步退出；漏斗适合线性路径，却可能遗漏反复往返的真实旅程。`,"A/B测试":`随机把相似用户分到两个版本，用结果差异估计单一改动的因果影响；样本量、污染和提前看结果都会破坏可信度。`,目标与关键结果:`目标描述要去的方向，关键结果用可验证结果证明进展。它不应退化成任务清单，也不能用不可控数字替代责任。`,关键绩效指标:`KPI把战略重点变成持续监测的数值，但指标一旦与奖惩绑定就会改变行为，因此必须配套防止被投机优化。`,蓝海战略:`它通过重组客户价值与成本要素开辟新的需求空间，而不只是避开竞争；新的空间成熟后仍可能变成红海。`,颠覆式创新:`新进入者先用更简单或更便宜的方案服务被忽视市场，能力逐步上移后冲击主流；突破性技术不一定构成颠覆。`,先发优势:`率先进入可抢占标准、网络和稀缺资源，但也要支付教育市场与试错成本；优势来自锁定机制，而非单纯时间早。`,后发优势:`后来者能观察前人的错误、采用成熟技术并重做定位，却仍需克服已有网络和品牌壁垒。`,纵向一体化:`企业把供应链上下游环节纳入自身控制，以换取协调和质量保障，同时承担更多固定成本与组织复杂度。`,横向一体化:`企业合并或控制同一价值链层级的竞争者来扩大范围与规模，可能增强效率，也可能削弱竞争。`,供应链韧性:`它关注供应受扰后继续服务和恢复的能力，依赖替代来源、可见性与缓冲，而不是把库存无限堆高。`,库存周转率:`它比较一段时间的销售成本与平均库存，反映库存变现速度；过高也可能意味着缺货和安全库存不足。`,现金转换周期:`从付给供应商到收回客户现金的净天数，串联库存、应收和应付；周期越短通常越少占用营运资金。`,定价权:`企业能在不大量流失需求的情况下提高价格，通常来自差异化、稀缺性或高转换成本，而非一次成功涨价。`,价格歧视:`同一产品按不同支付意愿收取不同价格，需要能识别客户且防止低价转卖；它不必然等同于非法歧视。`,免费增值:`免费层降低体验门槛，付费层向高需求用户收费。关键是免费能促成传播，付费差异又足够形成收入。`,病毒系数:`它估计每位现有用户平均带来多少新增用户；超过一才可能自增长，还必须结合邀请周期判断速度。`,平台战略:`平台设计规则和基础设施，让多方参与者彼此创造价值；核心工作是协调网络，而非只生产单一商品。`,社会化:`个体在互动中学习群体的语言、规则和角色期待，并逐渐形成身份；它贯穿一生，不只发生在童年。`,角色冲突:`同一人承担的不同角色提出不相容要求，使满足一方意味着亏欠另一方；它不同于单个角色内部界限不清。`,社会分层:`社会把财富、权力、声望和机会稳定地分配到不同位置，差异因制度延续，不只是个人能力的结果。`,文化资本:`被学校和主流机构认可的知识、品味与表达方式能转化为机会，但这种认可本身也带有群体边界。`,符号互动论:`人依据事物对自己的意义行动，而意义在互动和解释中生成、修正；同一行为因此可在不同群体中完全不同。`,标签理论:`社会反应会把某种行为固定成身份，标签随后改变他人待遇和当事人的自我理解，可能推动持续偏离。`,失范:`共同规范变弱或社会目标与合法手段脱节时，个人难以判断该遵循什么，越轨和不安因而增加。`,官僚制:`以明确层级、专业分工和成文规则处理大规模事务，换取一致性；规则也可能反过来取代原本目的。`,集体欢腾:`共同仪式中的情绪同步会让成员感到超越个人的力量，并强化群体身份、象征和道德边界。`,道德恐慌:`媒体、权威和公众把某群体或行为塑造成对社会秩序的巨大威胁，反应规模往往超过可核实危害。`,越轨:`行为是否越轨取决于特定群体、时间和权力关系中的规范判断，而非行为天然带有固定属性。`,参照群体:`人用某个群体的标准评价自己并决定如何行动，这个群体既可能是实际成员，也可能只是向往加入的对象。`,内群体偏好:`仅仅划分“我们”和“他们”就可能让资源、信任和善意向自己人倾斜，即使分组本身没有实质意义。`,外群体同质化:`人更熟悉自己群体内部差异，却把外部成员看成彼此相似，因而容易用少数样本概括整个群体。`,创新扩散:`新观念通过沟通网络逐步被不同接受者采用，速度取决于相对优势、兼容性、可试用性和可观察结果。`,临界点:`系统中的渐进变化累积到某个阈值后，会引发传播或状态的非线性跃迁；事后明显，事前往往难精确定位。`,社会流动:`个人或群体在社会位置间移动，可以是代际或一生之内、向上或向下；流动率反映机会结构而非个案故事。`,制度化:`反复实践逐渐被视为理所当然，并获得规则、角色和资源支持，从个人选择变成稳定的社会安排。`,人口转变:`社会通常经历死亡率先降、出生率后降的阶段变化，使人口先快速增长再趋于稳定并可能老龄化。`,城市化:`人口、就业和生活方式向城市集中，同时重组土地、家庭与公共服务；它不只等于城市人口数字增加。`,绅士化:`资本和较高收入者进入旧社区会改善设施、抬高地价，也可能把原居民和原有文化逐出。`,社会规范:`群体对合宜行为的共同期待通过赞许、羞耻和制裁发生作用，往往无需写进正式法律。`,群体极化:`相近立场的人讨论后常走向更极端，因为听到更多同向理由，也为了显示自己符合群体身份。`,回音室效应:`信息环境反复回传相似观点并过滤反对声音，使熟悉度被当成真实性，也让立场显得比实际更普遍。`,多元无知:`许多人私下不认同某规范，却误以为别人都支持，于是各自沉默并共同维持无人真正想要的局面。`,基因表达:`遗传信息并非始终全部开启；细胞通过转录和翻译选择何时、何处制造哪些产物，从而形成不同功能。`,表观遗传:`不改变DNA序列的化学标记和染色质状态会调节基因活性，部分可随细胞分裂保留，但并非所有环境影响都能遗传。`,突变:`DNA序列变化为演化提供新变异，可能有害、中性或有利；它随机发生于需求之前，不会因为个体想适应而定向出现。`,遗传漂变:`有限种群中，等位基因频率会因随机繁殖事件而变化，效应在小种群更强，方向不必提升适应度。`,基因流:`个体或配子在种群间迁移会带入等位基因，增加种群内部多样性，同时减小种群之间的差异。`,创始者效应:`少数个体建立新种群时只携带原群体的一部分变异，其后代频率会被这次随机抽样长期塑造。`,"捕食—被捕食关系":`捕食者与猎物数量彼此反馈，形成周期或稳定状态；两者并非简单的一方越多另一方就必然灭绝。`,环境容纳量:`特定环境在既定资源和限制下可长期维持的种群规模，会随气候、竞争和技术改变，不是固定上限。`,营养级联:`食物网高层物种的变化会沿多个营养级向下传递，间接重塑植被和环境，不能只看直接捕食对象。`,关键种:`某物种数量未必多，却对群落结构产生不成比例的影响；移除后可能触发整个生态系统重组。`,生物多样性:`它同时包括基因、物种和生态系统层面的差异，多样性常提升韧性，但不能只用物种数量概括。`,生态演替:`干扰后群落组成会按环境改变逐步替换，路径受起点和偶然事件影响，并非必然走向唯一的“成熟终点”。`,反馈调节:`系统输出反过来影响自身：负反馈抑制偏离以维持范围，正反馈放大变化并推动状态转换。`,细胞凋亡:`细胞按受控程序自我拆解并被清除，用于发育和防止异常扩散；它不同于损伤造成的失控坏死。`,免疫记忆:`首次识别抗原后留下的记忆细胞能在再次暴露时更快、更强地应答，这也是许多疫苗保护的基础。`,微生物组:`宿主体内外的微生物群及其基因与代谢共同影响健康，相关性很强却不表示某一种菌能单独解释复杂疾病。`,酶:`酶通过降低反应所需的活化能加快特定反应，本身不改变平衡位置，也不会在正常催化中被永久消耗。`,光合作用:`生物用光能把二氧化碳和水转成储存化学能的有机物，并释放氧；能量被转换而非凭空产生。`,细胞呼吸:`细胞逐步氧化有机物，把能量转移到ATP等可用形式；有氧呼吸效率高，但呼吸并不等同于肺部换气。`,渗透作用:`水跨半透膜向溶质有效浓度更高的一侧净移动，直到水势差被平衡；移动的主体是水而非溶质。`,水平基因转移:`遗传物质可在非亲子关系的生物间传播，使能力迅速跨谱系扩散，细菌耐药基因传播尤其常见。`,趋同进化:`亲缘较远的生物在相似选择压力下独立形成相似功能，外形相像不等于来自最近的共同祖先。`,协同进化:`相互作用的物种彼此施加选择压力，一方变化又改变另一方的演化方向，可能形成合作也可能形成军备竞赛。`,亲缘选择:`帮助携带相同基因的亲属也能提高基因传播机会，因此个体付出成本的行为仍可能被自然选择保留。`,表型可塑性:`同一基因型能随环境形成不同表型，使个体快速适应变化；这种反应范围本身受遗传与成本约束。`,演绎推理:`若前提真实且推理形式有效，结论必然成立；它保证从前提到结论的关系，却不替前提真实性背书。`,归纳推理:`从有限观察概括更广规律，结论只能得到概率支持。样本代表性和反例会决定概括有多可靠。`,溯因推理:`面对结果寻找最能解释证据的原因，得到的是当前最佳解释而非逻辑必然，应继续用新证据与替代解释竞争。`,绝对命令:`行动原则应能被一致地普遍化，并把人作为目的而非纯粹工具；它判断动机与规则，不按结果多少计分。`,功利主义:`它以所有受影响者的总体福祉评估行动，要求无偏地计算后果，但如何衡量福祉与保护少数权利是核心难题。`,德性伦理:`重点不是孤立行为符合哪条规则，而是一个有良好品格和实践智慧的人会如何长期生活与选择。`,社会契约:`政治与道德义务被理解为理性成员为共同生活可接受的规则，真实历史上是否签过合同并非必要条件。`,无知之幕:`设计规则时暂时不知道自己将处于哪种身份与资源位置，以减少为既得利益量身定做制度。`,存在主义:`人没有现成的本质替自己决定人生，选择会塑造自我并带来无法外包的责任；自由因此也伴随焦虑。`,荒诞主义:`荒诞来自人渴望终极意义与世界不提供确定回答之间的冲突。它不主张消极放弃，而是在看清冲突后仍选择行动。`,斯多葛主义:`它区分可由自己支配的判断与行动，以及不可控制的外部结果，把努力放在前者；这不是压抑情绪或听任不公。`,怀疑主义:`它要求检验证据与认知限度，暂缓超出理由的确定判断；方法性的怀疑并不等于否认一切知识。`,经验主义:`关于世界的知识主要接受观察和经验检验，概念仍需组织经验；它不意味着只相信个人直觉。`,理性主义:`理性结构和先验原则能提供不完全依赖感官的知识，尤其在逻辑数学中明显，但经验事实仍不能仅靠推演得到。`,现象学:`它先搁置对外部世界的惯常假设，细察事物如何在意识经验中呈现，以揭示经验结构而非做心理测量。`,辩证法:`它考察概念和现实内部的张力如何推动变化，反对把事物当成孤立静止；并非任何冲突都会自动产生更好结果。`,决定论:`若自然状态与规律完全给定，后续事件就随之确定；它是关于因果结构的命题，不直接等同于宿命或无需负责。`,自由意志:`问题在于人的选择能否真正由自己作出，以及这种控制是否足以承担责任，而不只是能否毫无原因地行动。`,心身问题:`它追问主观意识与物质身体是什么关系：两者是否同一种实体、如何相互作用，以及体验为何伴随神经过程。`,人格同一性:`它讨论一个人跨时间仍是“同一个人”依赖身体、记忆、心理连续还是其他条件，并非只问性格是否改变。`,电车难题:`它用极端冲突检验结果、意图、作为与不作为在道德判断中的分量，不是为了给现实事故提供唯一答案。`,忒修斯之船:`逐件替换组成部分后对象是否仍同一，迫使我们区分材料连续、功能连续和历史连续等不同身份标准。`,中文房间:`思想实验区分按规则处理符号与真正理解意义，质疑仅凭外在正确输出能否推出机器具有理解。`,善意原则:`解释他人论证时先采用合理且连贯的版本，避免靠最弱解读轻易获胜；善意不要求忽略明确错误。`,认识论谦逊:`它要求让确信程度匹配证据，主动考虑认知盲点和可错性，同时仍允许依据较好证据采取行动。`,实际利率:`它从名义利率中扣除通胀影响，反映资金购买力真正增减。近似相减便于理解，精确关系是倍率相除。`,费雪方程:`该关系把名义利率拆成实际回报与预期通胀，说明市场报价同时包含时间价值和购买力补偿。`,期限溢价:`投资者持有更长期债券通常要求额外补偿，以承担利率、通胀和流动性不确定；它会随市场环境变化。`,流动性溢价:`难以迅速按公允价格成交的资产必须提供额外预期回报来补偿变现摩擦，这与信用风险并非一回事。`,货币政策:`中央银行通过利率、准备金和流动性等工具影响融资条件与总需求，传导有时滞，也无法精准控制每个价格。`,量化宽松:`政策利率接近下限时，央行大规模购买资产以压低长期融资成本并增加流动性，不等于现金直接平均发给居民。`,定期定额投资:`按固定时间投入固定金额，会在低价时买得更多、高价时买得更少，主要价值是纪律与平滑时点风险，而非保证盈利。`,最大回撤:`它测量某段时期从历史峰值到随后最低点的最大跌幅，描述曾遭遇的下行体验，但高度依赖观察窗口。`,相关系数:`它把两个变量的线性同向程度标准化到负一至一；接近零仍可能存在非线性关系，也不能推出因果。`,风险价值:`VaR估计在给定期限和置信水平下通常不会被超过的损失阈值，却不说明超过阈值后会亏多少。`,情绪调节:`人通过改变情境、注意、解释或表达来影响情绪过程。有效调节不是消灭情绪，而是让反应服务于当前目标。`,控制点:`它描述人更倾向把结果归因于自己的行动还是外部力量；不同情境可不同，内控也不等于凡事责怪自己。`,自我决定理论:`自主、胜任和关系联结三种基本心理需要被满足时，动机更容易内化并长期维持。`,图式:`图式是组织经验的心理框架，帮助快速理解信息，也会筛掉不合预期的细节，因此既提高效率又制造偏差。`,认知重评:`在情绪反应充分展开前改变对事件意义的解释，从而调整感受与行动；它不是假装事实没有发生。`,暴露疗法:`在安全和可控条件下逐步接触恐惧线索，让人学到“焦虑可承受、灾难未必发生”，而非靠强迫硬撑。`,冒名顶替综合征:`有能力的人仍把成就归给运气或误判，并持续害怕被揭穿；它是体验模式，不是正式诊断或能力证据。`,聚光灯效应:`人高估别人对自己外表和失误的关注，因为自身体验在注意中心，而他人通常忙于关注自己。`,冷热同理差距:`人在平静与饥饿、愤怒或兴奋等强烈状态之间，很难准确预测另一个状态下的偏好和行为。`,蔡格尼克效应:`未完成任务会保持心理张力并更容易回到注意中；开始一个清晰的小步骤有时能利用这种牵引力。`,市场细分:`按需求、行为或可服务差异把整体市场分群，目标是支持不同策略，而不是按人口标签做任意切割。`,目标市场选择:`企业比较各细分市场的吸引力、自身能力和竞争条件后决定重点服务谁，也意味着主动放弃部分人群。`,品牌定位:`它规定品牌希望在目标客户心中占据的独特参照位置，必须相对于竞争选择和真实产品体验成立。`,品牌资产:`品牌名称带来的额外认知、偏好和价格能力可形成经济价值，既来自记忆联结，也必须由持续体验兑现。`,品牌显著性:`品牌在相关购买场景中被迅速想起或认出的程度，关注记忆可达性，不等同于消费者表示“很喜欢”。`,心智可得性:`购买需求出现时，品牌进入候选名单的概率取决于它与多少场景线索建立了强而独特的记忆联系。`,独特品牌资产:`颜色、形状、声音等线索能在不见品牌名时仍被正确识别，价值在于一致联结，而非单纯视觉漂亮。`,品类进入点:`它是触发消费者想到某品类的情境、目标或需求，品牌覆盖更多相关入口通常会增加被想起的机会。`,营销组合:`产品、价格、渠道和传播必须围绕同一目标客户协同；单独优化一个要素可能破坏整体价值交换。`,消费者洞察:`洞察揭示行为背后的张力、动机和未满足需求，并能导出行动；对数据的重新描述还不是洞察。`,客户旅程:`它按客户视角串联从需求出现到购买、使用与离开的全过程，跨越企业内部部门而不是跟着组织架构画。`,营销触点:`客户与品牌发生接触的每个时刻都会提供信息和感受，影响下一步选择；触点价值取决于所处旅程阶段。`,声量份额:`品牌传播量占品类总传播量的比例，可反映注意竞争，却不能单独证明记忆、销售或利润真的增长。`,市场份额:`企业销量或收入占整体市场的比例，必须明确地域、品类、渠道和时间口径，否则数字无法比较。`,价值定价:`价格依据客户获得的经济或体验价值设计，而不只是在成本上加成；前提是价值可识别、可沟通且部分可获取。`,市场渗透率:`目标市场中已经采用某产品或品牌的人所占比例，既受需求影响，也受分销覆盖和市场定义影响。`,内容营销:`持续提供对目标受众有用的内容来建立记忆与信任，并引导后续行为；内容流量本身不是商业结果。`,效果营销:`围绕可追踪行为即时购买和优化流量，擅长收割已有需求，但过度依赖会忽略品牌与未来需求的积累。`,营销归因:`它按规则或模型把转化价值分配给多个接触点。归因结果依赖可观测数据，不能把“最后被记录”当成完整因果。`,口碑传播:`人际推荐因带有关系信任而影响选择，强度来自可讲述的体验与传播动机，并非发一个分享按钮就会发生。`,认识论:`它追问知识如何可能、证据怎样支持信念以及我们能知道到什么程度，区别于单纯罗列已有事实。`,本体论:`它研究世界中究竟存在哪些基本事物及其类别关系；选择不同本体，会改变问题能被怎样描述。`,虚无主义:`它否认某类既定价值、意义或真理具有客观根据，但不同形式否认的对象不同，不等于日常生活必然消极。`,道德运气:`两人意图和行为相近，却因不可控结果不同受到不同道德评价，这暴露责任判断与控制原则之间的冲突。`,葛梯尔问题:`一个信念即使真实、有理由，也可能只是碰巧为真，因此“有根据的真信念”仍不足以完整定义知识。`,差别原则:`社会经济不平等只有在能改善最不利者处境时才可被允许，它不是要求所有结果完全相同。`,结果论:`行动对错主要取决于造成的后果，争论焦点包括计算哪些后果、影响谁以及是否保留权利限制。`,义务论:`某些行为因其原则、权利和义务本身而对错，即使违反它可能带来更多总收益，也不能自动被正当化。`,相容论:`自由与因果决定可以并存：只要行动源自人的理由和欲望且未受强迫，就可能足以支持责任。`,反思平衡:`在具体判断与一般原则之间来回修正，直到两者形成较一致的整体；任何一端都不是不可动摇的起点。`,基准率:`判断个案前先看该事件在总体中原本多常见，再用新证据更新；检验准确率很高，也可能被极低的发生率压倒。`,抽样偏差:`被观察样本进入研究的机会并不相同，会让样本系统性偏离目标总体；增加同类样本数量无法修复这种偏离。`,选择偏差:`进入比较组的过程同时与原因和结果有关时，组间差异可能来自“谁被选进来”，而不是处理本身。`,相关不等于因果:`两个变量一起变化，可能由第三因素、反向作用或偶然性造成。因果结论还需要时间顺序和可排除的替代解释。`,混杂变量:`它同时影响被研究的原因与结果，从而制造或遮蔽两者关系；需要设计或统计控制，而不是事后口头说明。`,辛普森悖论:`分组中一致的趋势在合并后可能反转，因为各组权重和基础水平不同；总平均会隐藏关键结构。`,大数定律:`独立重复次数增加时，样本平均会靠近真实期望，但它不保证短期平稳，也不让罕见事件按固定节奏出现。`,中心极限定理:`满足条件时，许多独立贡献之和或均值经过标准化会趋近正态分布，即使单个变量本身并不正态。`,标准差:`它用原始量纲表达数据围绕均值的典型离散程度；分布偏斜或有极端值时，单独使用容易误读。`,置信区间:`它由重复抽样程序产生：长期看一定比例的区间会覆盖真实参数；不是说本次固定区间内有相同概率存在参数。`,P值:`在零假设成立时，获得当前或更极端数据的概率。它既不是零假设为真的概率，也不衡量效果有多重要。`,统计显著性:`结果达到预设错误率门槛，只表示与零假设较难相容；样本很大时，微小而无用的差异也能显著。`,实际显著性:`它追问差异大小是否足以改变现实决策，要结合效应量、成本、风险和业务阈值，而不只看检验结果。`,第一类错误:`实际上没有效应却错误地判定存在，也叫假阳性；显著性水平控制的是长期发生此类错误的上限。`,第二类错误:`实际上有效应却没有检出，也叫假阴性；样本不足、噪声过大或效应较小时尤其常见。`,统计功效:`当指定大小的真实效应存在时，检验将其发现的概率；它由样本量、噪声、效应和错误率共同决定。`,多重比较:`同时检验许多假设会累积偶然显著结果，必须调整错误率或预先限定主要检验，不能只挑最好看的结果。`,回归分析:`它估计控制其他变量后，自变量变化与结果的条件关系。模型形式和遗漏变量会影响估计，系数本身不自动具有因果意义。`,随机对照试验:`随机分配使两组在平均意义上可比，因此结果差异可归于干预；失访、交叉污染和执行偏差仍需检查。`,外推风险:`在一个人群、时期或环境中成立的结果，换到新条件下可能失效；关键是作用机制所依赖的条件是否仍存在。`,供给与需求:`价格协调买卖双方的意愿：价格变化通常沿曲线移动，收入、成本或偏好变化则会推动整条曲线移动。`,需求弹性:`它比较需求量变动比例与价格变动比例，反映消费者的替代空间；弹性会随时间、品类范围和预算占比变化。`,价格上限:`法定最高价低于市场均衡时，会扩大需求并压缩供给，短缺可能转为排队、配给或黑市价格。`,价格下限:`法定最低价高于均衡时，会增加供给并减少需求，形成剩余；谁承担成本取决于具体市场结构。`,外部性:`一方行动把收益或成本带给未参与交易的人，而市场价格没有完整反映，于是私人选择偏离社会最优。`,公共品:`非排他使人难被阻止使用，非竞争使一人使用不减少他人可用量；两种特征共同造成市场供给不足。`,搭便车问题:`个人即使不付费也能享受集体成果，于是人人都有少投入的激励，最终让共同需要的资源无法形成。`,比较优势:`即使一方所有事情都做得更高效，双方仍可按相对机会成本分工并交易；关键比较的是放弃什么。`,交易成本:`寻找信息、谈判、监督和执行都要消耗资源，这些摩擦决定交易通过市场还是组织内部完成。`,信息不对称:`交易双方掌握的关键事实不同，会影响定价、筛选和行为；披露、担保和声誉是降低问题的制度安排。`,委托代理问题:`代理人掌握更多信息且目标与委托人不完全一致时，可能替自己优化；监督和激励也有成本，无法彻底消除。`,激励相容:`制度让参与者按自身利益行动时，仍会选择设计者希望的真实或合作行为，而无需依赖道德号召。`,边际分析:`决策应比较多做一单位带来的新增收益与新增成本，而不是用总收益或平均成本判断是否继续。`,规模不经济:`组织扩大到一定程度后，协调、沟通和官僚成本增长得更快，使单位成本反而上升。`,创造性破坏:`新技术和商业组织在创造更高生产率的同时淘汰旧企业、岗位和资本，增长与损失发生在不同人群。`,寻租:`参与者把资源投入争夺政策特权或既有财富，而非创造新价值；所得转移之外，争夺过程本身也造成浪费。`,消费者剩余:`消费者最高愿付价格与实际支付价格之间的差额，表示交易给买方留下的净价值。`,囚徒困境:`各自理性选择防备会把双方带到较差结果，因为个人收益结构惩罚单方面合作；重复互动可改变这种结构。`,纳什均衡:`在别人策略不变时，没有任何一方愿意单独改变选择；均衡表示稳定，不代表公平、合作或整体最好。`,人力资本:`知识、技能和健康能提高个人生产能力并带来未来收益，但其形成受教育机会和制度环境限制。`,授权:`管理者把明确结果、相应权限和资源交给执行者，同时保留必要的支持与问责；只交任务不交权不算授权。`,控制幅度:`它是管理者直接负责的人数，合适范围取决于任务复杂度、成员成熟度和协作标准化程度。`,RACI矩阵:`它把任务中的执行、最终负责、咨询和知会角色拆开，重点是每项结果只有清楚的最终责任归属。`,单一责任人:`每项结果由一个人最终承担协调和交付责任，以避免“人人负责等于无人负责”；他不必亲自完成所有工作。`,决策权:`它明确谁能作出哪类决定、需要听取谁以及何时升级，减少信息拥有者与批准者反复拉扯。`,向上管理:`主动理解上级目标和信息需求，及时暴露风险并提出可选方案，以改善协作；不是逢迎或替上级承担全部责任。`,利益相关者地图:`按影响力、受影响程度和立场识别相关方，以决定沟通与参与方式；名单本身还不是管理策略。`,组织沉默:`成员掌握问题却集体不说，常因报复风险、无效感或关系压力；表面安静不能被当成真实同意。`,情境领导:`领导方式应随任务和成员准备度调整，在指导与支持之间变化，而非把某一种风格当成普遍最佳。`,反馈回路:`行动产生结果，结果信息再改变下一轮行动；反馈延迟、失真或被截断会让组织重复同样错误。`,一对一会议:`它是管理者与成员定期讨论进展、阻碍、反馈和发展的专属空间，不应只变成项目状态汇报。`,艰难对话:`在事实解释、情绪和身份威胁交织时，先分开观察与推断，才能同时处理问题和关系。`,最佳替代方案:`谈判失败后最有价值的现实选择决定底线和议价能力；愿望或模糊的“再看看”不算可执行替代方案。`,无权威影响力:`没有正式命令权时，通过可信度、互惠、共同目标和联盟推动行动；核心是让对方看见合作理由。`,事前验尸:`在行动前假设项目已经失败，再反向列出可能原因，能降低乐观和地位压力造成的风险遗漏。`,行动后复盘:`把预期、实际、差异和原因分开讨论，提取下一次可改变的做法；它不是追责会，也不是流水账。`,决策日志:`在结果未知时记录信息、假设、概率和理由，之后才能区分判断质量与运气，并校准长期决策。`,会议成本:`参会人数乘以时间只是直接成本，注意切换和延迟决策也是成本；会议应有必须同步互动的明确产出。`,职业资本:`稀缺且有价值的技能、成果和关系会积累职业选择权，偏好通常要靠这些筹码才能兑现。`,导师与赞助人:`导师提供建议和反馈，赞助人则在关键场合用自己的信誉为你争取机会；两种关系的投入和风险不同。`,期望值:`把每种结果乘以其概率再相加，得到重复机会的平均回报；一次结果不会等于期望，极端损失也可能不可承受。`,期望效用:`它对结果带来的主观价值而非金额直接加权，因此能解释同一笔钱对不同财富与风险偏好的人意义不同。`,决策树:`把选择、随机事件、概率和结果按顺序展开，使隐藏分支与后续选择可见；树的质量仍取决于输入是否完整。`,敏感性分析:`一次改变关键假设，观察结论如何变化，从而找出真正驱动结果的变量和最值得核验的信息。`,情景规划:`围绕几个关键不确定性构造相互一致的未来世界，用来检验战略，而不是挑一个最喜欢的预测。`,蒙特卡洛模拟:`从输入的概率分布反复随机抽样，生成结果范围和尾部风险；模拟不会自动修复错误的分布假设。`,信息价值:`新信息的价值等于它可能改善决策所带来的收益减去获取成本；不会改变行动的信息通常没有决策价值。`,实物期权:`分阶段投入保留扩大、延迟或退出的权利，使不确定性不仅是风险，也可能增加等待和学习的价值。`,可逆决策:`容易撤回的选择可先小步行动并快速学习；不可逆选择则值得提高证据门槛、扩大参与和保留缓冲。`,最小后悔原则:`在概率难以可信估计时，选择相对各情景最佳方案损失最小的选项，重点是避免事后巨大落差。`,满意化决策:`在时间和信息有限时，先设定最低可接受标准，找到达标方案就停止搜索，而不追求无法证明的全局最优。`,二阶效应:`不仅问行动立即造成什么，还追踪结果如何改变激励、行为和下一轮条件；远期效应可能抵消第一层收益。`,概率校准:`长期看，标为70%把握的事件应约有70%发生。校准关注信心与命中率匹配，不等同于每次都猜对。`,OODA循环:`观察环境、形成解释、作出决定并行动，再以结果更新下一轮；优势来自更快且更准确地循环，而非只追求速度。`,鲁棒决策:`不押注一个精确预测，而选择在多种合理未来中都能接受的方案，愿意牺牲部分最佳情景收益换取稳健。`,积极倾听:`听者暂缓准备反驳，用复述、追问和情绪识别确认对方真正表达的事实与关切，不只是保持沉默。`,原则性谈判:`把人际关系与问题分开，围绕利益和客观标准创造方案，同时用替代方案保护底线。`,立场与利益:`立场是公开要求，利益是要求背后的需要、担忧和约束；不同立场可能由可兼容的利益产生。`,协议可能区间:`只有双方可接受范围发生重叠，交易才有可能；若底线无交集，技巧也无法制造真实协议空间。`,战术同理心:`准确说出对方的感受与视角来降低防御并获取信息，并不表示赞同其结论或放弃自己的边界。`,非暴力沟通:`把可观察事实、自己的感受、未满足需要和具体请求分开表达，避免把评价包装成事实或把命令叫作请求。`,SBI反馈:`先指出具体情境，再描述可观察行为和造成的影响，让对方知道要改变什么，避免用人格标签概括。`,钢人论证:`先把对方观点重建成其本人也认可的最强版本，再提出异议；这样检验的是核心主张而非表达瑕疵。`,开放式提问:`用不能只回答是或否的问题邀请对方描述过程、理由和需要，目的在获取信息，而不是把答案藏在问句里。`,复述确认:`用自己的话重述听到的内容并请对方校正，能暴露双方对词义、范围和优先级的不同理解。`,金字塔原理:`先给核心结论，再用相互独立且合起来完整的理由分层支撑，让读者按问题结构而非写作过程理解。`,SCQA结构:`先建立共同情境，再指出冲突、提出核心问题并给出答案，用张力解释为什么此刻需要听这个结论。`,面子协商:`冲突双方会维护自己和关系群体的社会形象，文化与权力差异影响人选择直接、回避还是第三方调解。`,沉默策略:`提出条件后有意识地停止说话，让对方思考或补充信息；它需要承受不适，而不是用冷处理惩罚关系。`,沟通闭环:`发送信息后必须有接收确认、理解复述和执行反馈，才能知道消息已转化为一致行动。`,要约与承诺:`要约必须足够确定且表明受接受即受约束，承诺则要在期限内与要约实质一致；改条件通常构成新要约。`,合同相对性:`合同原则上只在缔约双方之间产生权利义务，不能当然要求未参与合同的第三人履行。`,格式条款:`一方预先拟定并重复使用的条款，提供方对重大利害内容负有提示说明义务，不合理免责可能无效。`,表见代理:`无真实代理权的人呈现足以让相对人合理信赖的权利外观时，行为后果可能仍归属于被代理人。`,举证责任:`主张某项事实的一方通常要提供足以支持它的证据；无法证明时，承担的是程序上的不利后果。`,证据链:`多项证据在来源、时间和内容上相互印证，才能从事实片段连到待证结论；数量多不等于链条完整。`,电子数据:`聊天、邮件、平台记录等可成为证据，但真实性、关联性、合法来源和完整上下文都需验证。`,可靠电子签名:`能专属于签名人、识别其身份并发现签署后改动的电子签名，在满足法定条件时具有相应效力。`,诉讼时效:`权利人长期不行使请求权，超过法定期间后可能失去法院强制保护；期间起算、中止和中断需具体判断。`,不可抗力:`不能预见、不能避免且不能克服的客观事件可能影响责任，但仍要证明因果关系并及时通知、减损。`,违约金:`当事人预先约定违约后的支付责任，兼具补偿和督促功能；明显高于或低于实际损失时可能依法调整。`,定金:`依法约定并实际交付后才发生担保效力，违约时可能适用没收或双倍返还；它与普通预付款后果不同。`,劳动关系:`判断重点是持续接受用人单位管理、从事其业务并获得报酬等实际从属性，合同标题不能单独决定关系性质。`,保密义务:`对具有保密价值且采取保护措施的信息承担不披露、不滥用责任，范围、期限和例外应明确。`,个人信息最小必要:`处理个人信息只能收集实现明确目的所必需的范围，方便或“以后可能有用”不能替代必要性。`,正式组织与非正式组织:`成文岗位和流程之外，人际信任、惯例与影响网络也在分配信息和推动行动，两套结构会相互补充或冲突。`,心理契约:`员工与组织对承诺和互惠形成未写进合同的期待；一方感到被违背时，投入和信任会下降，即使法律条款未变。`,组织公民行为:`员工自愿做出超出正式职责、帮助组织运转的行为；长期把自愿贡献当成义务，会耗尽这种善意。`,角色超载:`角色要求的总量超过个人时间和资源容量，问题是负荷过多；它不同于不知道该做什么的角色模糊。`,角色模糊:`目标、权限、标准或优先级不清，使成员无法判断怎样算完成；增加努力不能代替澄清边界。`,社会惰化:`集体任务中个人贡献难被识别时，部分成员会减少投入；明确责任、缩小团队和提高任务意义可降低它。`,团队发展阶段:`团队常经历组建、冲突、规范和高效协作，阶段并非严格线性，成员与任务改变时可能回退。`,权力距离:`它描述群体接受权力不平等的程度；高权力距离环境中，下级更少公开质疑，但不代表内心真正认同。`,组织公平:`成员同时评价结果分配、过程程序、人际对待和信息解释；薪酬相同也可能因过程不透明而感到不公。`,工作重塑:`员工主动调整任务边界、合作关系或对工作的理解，使岗位更匹配优势和意义，同时仍需守住组织目标。`,公平理论:`人比较自己与参照对象的投入产出比；感到失衡后会改变努力、要求回报或重新选择参照。`,期望理论:`动机取决于努力能否带来绩效、绩效能否带来回报，以及回报是否真正被重视，任一环节接近零都会削弱投入。`,人岗匹配:`个人能力与岗位要求、个人需要与岗位供给相互吻合时，表现和留任更可能提高；匹配会随岗位变化。`,组织双元性:`组织同时利用成熟业务追求效率，又探索新机会承受试错，两套逻辑需要不同结构并保持资源联系。`,筒仓效应:`部门围绕局部目标封闭信息和资源，使跨部门流程断裂；根因常在指标、权限和身份边界，而非个人不愿合作。`,自由现金流:`经营产生的现金扣除维持和扩张所需资本支出后，才是可用于偿债、分红或再投资的余量；它不同于会计利润。`,加权平均资本成本:`按债务和股权在资本结构中的权重合并各自要求回报，并考虑税盾，用作与项目风险匹配的折现基准。`,市盈率:`股价相对于每股盈利的倍数，反映增长、风险和资本回报预期；亏损企业或盈利周期剧烈时容易失真。`,信用评级:`评级机构对债务按约偿付能力的相对判断，会影响融资成本，但它是意见和滞后指标，并非本息保证。`,自我知觉理论:`当内部感受不明确时，人会像观察别人一样，从自己的行为和情境反推态度，因此行为也能反过来塑造自我认识。`,自我效能感:`它是对自己能否完成某项具体任务的判断，会影响投入和坚持；既不同于总体自尊，也需要真实掌握经验支撑。`,情绪颗粒度:`能把笼统的“难受”区分为失望、羞耻或焦虑，会提供更精确的行动信息，也有助于选择合适调节方式。`,情感启发式:`人用对对象的即时好恶快速判断风险和收益，喜欢时常高估好处、低估风险；情绪成为了计算替代品。`,价值链:`把企业从输入到交付的活动拆开，判断每一环怎样增加客户价值和形成成本，竞争优势往往来自环节之间的配合。`,竞争定位:`企业选择服务谁、满足什么需求以及用何种不同活动系统取胜；真正定位也意味着明确不做什么。`,经常性收入:`订阅、维护费等按周期重复发生的收入提高可预测性，但只有客户持续获得价值并续费，才算高质量。`,渠道冲突:`不同销售渠道因价格、客户归属和资源分配互相侵蚀，若权责与差异化不清，新增渠道可能只搬移原有销量。`,社会再生产:`家庭、教育和制度把既有阶层的资源与优势传递给下一代，使不平等在看似中性的规则中延续。`,制度信任:`人相信规则和机构会稳定、公正地运作，因此愿意合作并接受结果；它区别于对某位具体官员的私人信任。`,社会建构论:`许多被视为自然的类别和意义，是在语言、制度与反复互动中形成并获得现实后果；建构不等于虚假或随意。`,地位焦虑:`人担心自己在社会比较中落后或不被认可，焦虑来自相对位置和评价标准，而不只是绝对资源不足。`,基因环境交互:`同一遗传差异在不同环境下可能产生不同结果，环境影响也会因基因型而异，不能把两者贡献简单相加。`,进化权衡:`资源有限使某项适应优势常以另一功能的成本为代价；自然选择寻找的是特定环境下的可行组合，而非完美设计。`,限制因子:`多种资源中最稀缺或最接近阈值的一项决定系统增长，再增加其他充足资源也难以改善结果。`,演化军备竞赛:`相互对抗的物种不断升级防御与攻击，一方优势改变另一方选择压力，投入增加却未必带来长期净优势。`,认知谦逊:`承认自己可能错，并能指出结论依赖的证据和条件；它要求可修正的自信，而不是因为不确定就拒绝判断。`,必要条件与充分条件:`没有必要条件，结果一定不成立；有充分条件，结果一定成立。把“不可缺少”误写成“有它就够”是常见错误。`,范畴错误:`把只适用于一类事物的属性或问题套到另一类对象上，语句看似有答案，实际在概念层面放错了位置。`,事实价值区分:`关于世界怎样的事实，不能单独推出世界应该怎样；规范结论还必须显露其价值前提。`,中位数:`排序后位于中间的位置把样本分成两半，对极端值较稳健，但不会展示分布尾部和内部差异。`,百分位数:`某数值高于样本中多少比例的位置指标，适合比较相对排名；不同参照人群会得到不同百分位。`,离群值:`远离多数数据的观察可能是错误、罕见事件或新机制的信号，不能机械删除，应先追查来源与影响。`,效应量:`它量化差异或关系到底有多大，帮助判断现实重要性，并可跨样本量比较；显著性不能替代它。`,生产者剩余:`卖方实际获得价格高于其最低愿售价格的部分，代表交易给生产者留下的净收益，不等同于会计利润。`,无谓损失:`税、垄断或其他扭曲阻止了原本对双方都有利的交易，消失的总剩余没有转移给任何一方。`,边际报酬递减:`其他投入固定时，持续增加某一种投入，新增产出最终会下降；它讨论边际变化，不表示总产出立即减少。`,市场失灵:`外部性、公共品、信息差或市场势力使价格机制无法实现有效配置；政府介入仍需比较自身执行成本。`,PDCA循环:`先设定可检验计划，执行小步行动，核对结果与预期，再据此修正标准或方案，形成持续学习闭环。`,变革管理:`组织改变需要同时处理方向、利益、能力和日常行为，把新做法嵌入流程与激励，而不只是发布愿景。`,资源配置:`把有限的人、钱和注意力投向不同优先级，实质是作出取舍；预算保留原样也代表继续选择旧战略。`,继任计划:`提前识别关键岗位风险并培养多个可接替人选，保持能力连续性；它不是私下指定某人的晋升承诺。`,决策矩阵:`把备选方案按明确标准和权重评分，使取舍可见；数字能组织偏好，却不能把主观权重变成客观真理。`,参照类预测:`先看一组真正相似项目的实际结果分布，再调整当前项目差异，能纠正只盯内部计划造成的乐观偏差。`,停止规则:`在开始前写明何种证据、损失或时间点会触发退出，防止投入增加后不断移动终点。`,偏好反转:`同一个人对相同选项的排序会随呈现方式、评价方法或时间距离改变，说明偏好并非始终稳定且完整。`,沟通噪声:`编码、渠道、环境和心理预期都会让信息在传递中失真；重复发送不如确认对方实际理解了什么。`,元沟通:`讨论“我们此刻怎样沟通”，把语气、关系和规则本身拿到台面上，常能解除内容争论背后的互动僵局。`,异议处理:`先识别异议是信息不足、风险担忧、利益冲突还是拒绝，再回应真实障碍；急于反驳只会强化防御。`,利益交换:`双方在重视程度不同的事项上互相让步，以低成本满足对方高价值需求，前提是先揭示而非假定偏好。`,合同效力:`合同成立后是否具有法律约束力，还要看主体能力、意思表示、内容合法性等；成立不必然等于有效。`,违约责任:`一方不履行或履行不符合约定时，可能承担继续履行、补救或赔偿等后果，具体受因果和可预见范围限制。`,减损义务:`违约发生后，守约方也应采取合理措施避免损失扩大；可避免却放任增加的部分通常不能全部转嫁。`,职务成果权属:`员工在职责内或主要利用单位条件完成的成果，其权利归属受成果类型、法律规则和合同约定共同影响。`,职业倦怠:`长期工作压力未被恢复时，会出现耗竭、疏离和效能下降；它是工作情境问题，不宜只归咎于个人不够坚强。`,员工敬业度:`成员愿意投入精力、保持专注并与工作建立联系，通常受意义、资源、公平和支持影响，不等于无条件加班。`,领导成员交换:`领导与不同成员会形成质量不同的信任和资源交换关系；差异若缺乏合理依据，会造成圈层和不公平。`,组织认同:`成员把组织身份纳入自我概念，因此组织成败会影响自我评价；认同能促进投入，也可能压制必要批评。`,营运资本:`流动资产减流动负债只是静态数值，更重要的是库存和应收如何占用现金，以及应付如何提供短期资金。`,资本结构:`债务带来税盾和固定偿付压力，股权分担风险却稀释收益与控制，合理组合取决于现金流稳定性。`,双部收费:`固定费先获取进入资格的价值，按量价格再影响使用强度；两部分应一起设计，而非各自追求最高。`,供给弹性:`它看价格变化后生产者能增加多少数量，短期受库存产能限制，时间越长通常越有调整空间。`,待办任务理论:`客户在某个情境中“雇用”产品推动生活或工作进展，竞争者因此包括所有能完成同一任务的替代方式。`,北极星指标:`它应衡量客户核心价值被反复实现，并能解释长期增长；如果团队可在不改善体验时轻易拉高，它就不是北极星。`,蚕食效应:`新产品的销量若来自原有客户转移，组合利润可能不增反降；评估时要拆开新增需求与内部迁移。`,渠道优势:`优势来自长期可重复的触达能力、关系和单位成本，而非一次购买流量；渠道是否可被复制决定其防御性。`,矩阵式组织:`成员同时服务专业线和业务线，能共享稀缺能力，却会产生双重优先级；必须事先明确冲突裁决权。`,权责对等:`对结果负责的人需要拥有调整人员、资源和范围的实际权限，否则问责只会落在无法改变结果的人身上。`,情绪劳动:`岗位要求员工调节表情和感受以符合服务规范，这种自我控制会消耗心理资源，应被视为真实劳动成本。`,组织承诺:`留下可能来自情感认同、道德责任或离开成本，不同来源会带来不同的主动投入和离职反应。`,心理反抗:`当人感到自主选择被夺走，会通过反对、拖延或追求被禁止选项恢复自由；命令强度可能反而放大阻力。`,情绪传染:`人会自动模仿他人的表情、语调和节奏，并据此同步感受；高地位者的情绪通常传播得更远。`,错误记忆:`记忆每次提取都会被当前线索重新建构，暗示和后来信息能进入回忆，所以真诚与准确并不是一回事。`,自我设限:`人在表现前制造障碍，让失败可归因于借口、成功显得更有能力；代价是主动降低了真实成功概率。`,方差:`它把每个值离均值的距离平方后取平均，使较大偏离受到更重权重；平方量纲不直观，开方后才是标准差。`,协方差:`它看两个变量相对各自均值是否同向偏离，正负表示方向，但数值受量纲影响，不能直接比较强弱。`,决策惯性:`默认选项、切换成本和责任回避会让旧决定自动延续，即使当初的条件已经改变；维持现状也应重新举证。`,探索与利用:`利用把资源投向已知高回报，探索为未来寻找更好选项；只做前者会固化，探索过多则无法兑现价值。`,文化滞后:`技术和物质条件变化速度快于法律、规范与观念，旧规则暂时继续管理已改变的生活，因而产生摩擦。`,隐性课程:`制度通过座位、奖惩、权限和日常互动传授未写明的价值，实际学到的常比正式口号更有力量。`,社会封闭:`占优势群体用资格、关系或文化标准控制资源入口，门槛既可能验证能力，也可能保护既得位置。`,道德经济:`经济行为还受共同体关于公平、义务和正当价格的判断约束，市场合法不表示社会一定认为合理。`,保证责任:`保证人为他人债务提供信用支持，责任方式、范围和期间决定何时承担多少风险，签名绝非普通见证。`,合同解除:`解除使尚未履行的合同义务终止，但结算、清理和违约责任可能继续存在；必须有约定或法定依据。`,证据保全:`在证据可能灭失或难以取得前，用符合法律要求的方式固定来源、内容和状态，重点是未来可核验性。`,消费者知情权:`经营者应真实、全面提供会影响购买决定的重要信息，不能用显眼优惠掩盖自动续费或关键限制。`,反例法:`普遍命题声称所有对象都成立，只需找到一个满足条件却不符合结论的实例，就足以推翻其普遍性。`,循环论证:`前提只是换一种说法重复结论，因此表面有理由，实际没有提供独立支持；跳出循环需要外部证据或原则。`,自然主义谬误:`从“自然存在”或“多数如此”直接跳到“应该如此”，中间遗漏了规范前提；事实描述不能独自产生道德许可。`,诠释学循环:`对局部的理解依赖整体预期，整体又要由局部证据不断修正；循环是深化理解的过程，不必是逻辑错误。`,多效性:`同一基因参与多个生理或发育通路，因此选择一个性状时会连带改变其他性状，限制了单独优化的可能。`,频率依赖选择:`某特征的收益取决于它在种群中有多常见，稀有时有利的策略普及后可能失去优势。`,适应度景观:`不同性状组合对应不同繁殖成功率，种群可能困在局部高峰，因为去往更高峰要先经过低适应区。`,生态位构建:`生物通过行为改变环境，改变后的环境又反过来选择自身和其他物种，因此适应并非单向接受条件。`},_=[{name:`全部`,color:`#e3be62`,icon:`✦`},{name:`经济与金融`,color:`#d27655`,icon:`↗`},{name:`商业与市场`,color:`#4ea69f`,icon:`◆`},{name:`组织与管理`,color:`#708f55`,icon:`▦`},{name:`心理与行为`,color:`#9b83c4`,icon:`◉`},{name:`统计与决策`,color:`#b86f91`,icon:`Σ`},{name:`社会与文化`,color:`#d2a044`,icon:`◎`},{name:`法律与制度`,color:`#8172a5`,icon:`§`},{name:`哲学与逻辑`,color:`#5e94c6`,icon:` tion:`人一旦形成判断，就会更注意支持它的材料，把反对证据视为例外、错误或不可信。问题不在于人完全看不见反证，而在于同一条证据会因为是否符合原观点而被赋予不同分量。`,scenario:`例如，产品经理认定新功能很受欢迎，只访谈了10名活跃用户，却没有查看20名已流失用户的反馈。补做流失访谈后，他发现多数人正是因为该功能增加了操作步骤而离开，于是取消了原定的全面推广。`},锚定效应:{explanation:`最先接触到的数字会成为估算起点，之后即使获得新信息，人们通常也只做不足的调整。因此锚点不必正确，甚至不必与问题真正相关，也能影响报价、预测和谈判结果。`,scenario:`例如，候选人谈薪前先提出月薪25,000元，并附上同岗位薪酬报告；招聘方原计划给20,000元，最终把报价提高到23,000元。若谈判从公司原报价开始，双方讨论的中心通常会更低。`},损失厌恶:{explanation:`面对同样大小的得失，人们通常对损失更敏感。它会让人为了避免确认亏损而继续冒险，也会让已经拥有的东西显得比尚未拥有时更值钱。`,scenario:`例如，小李以每股100元买入一只股票，跌到70元后仍拒绝卖出，只因为卖出会把账面亏损变成实际亏损。他后来问自己：如果现在手里是7万元现金，还会不会按70元买入？答案是否定的，于是按当前信息重新配置了资金。`},旁观者效应:{explanation:`突发事件中，在场者越多，责任越容易被分散：每个人都以为别人会行动，也会观察他人的平静反应来判断事情是否严重。它不是说明旁观者冷漠，而是说明责任不明确会拖慢行动。`,scenario:`例如，地铁站有人突然倒地，周围有十多个人却没人立即报警。一名乘客直接指向穿蓝衣服的人说“请拨打120”，再请另一人联系站务；任务被明确分配后，两人立即行动。`},可得性启发:{explanation:`大脑常用“一个例子有多容易想起来”代替“这件事实际有多常发生”。刚看过、情绪强烈或画面鲜明的事件更容易被回忆，因此会被误判为更常见或风险更高。`,scenario:`例如，一周内连续看到3条飞机事故新闻后，小周取消了出差航班，改为开车12小时。决定前他没有比较每公里事故率，只是因为空难画面更容易想起而高估了飞行风险。`},框架效应:{explanation:`同一结果用“获得”还是“失去”来表达，会把注意力引向不同参照点，从而改变选择。事实本身没有变化，变化的是人如何感受风险以及把什么视为默认结果。`,scenario:`例如，医生向两组患者介绍同一种手术：一组听到“90%的患者能存活五年”，另一组听到“10%的患者会在五年内死亡”。两句话数值完全相同，但前一组愿意接受手术的人明显更多。`},沉没成本谬误:{explanation:`已经付出且无法收回的时间、金钱或精力，不应继续影响下一步选择。是否继续只应比较未来还要付出的成本与未来可能获得的收益，而不是试图证明过去的投入没有白费。`,scenario:`例如，一家公司已为失败项目投入80万元，继续开发还需40万元，而预计只能带来20万元收入。负责人没有因为“已经投入很多”而追加预算，而是停止项目，把剩余40万元转向已验证有需求的产品。`},心理安全感:{explanation:`团队成员相信，提出疑问、承认错误或反对多数意见，不会因此遭到羞辱、报复或被贴上无能标签。它允许坦诚暴露问题，但不等于降低绩效标准或回避责任。`,scenario:`例如，发布前一晚，实习生发现支付模块可能重复扣款。主管没有质问他为何这么晚才说，而是暂停上线并组织4人排查，最终修复了会影响约3%订单的缺陷；复盘时仍明确了测试遗漏的责任。`},净现值:{explanation:`净现值先把未来每期现金流按资金成本折算成今天的价值，再减去初始投入。结果大于零，表示项目在覆盖资金的时间成本和风险要求后仍创造额外价值；它不是把未来收入直接相加。`,scenario:`例如，一家门店改造需先投入100万元，预计未来3年分别净回款45万、45万和40万元。按8%的折现率计算，三笔回款的现值合计约112万元，净现值约12万元，因此项目在这些假设下值得考虑。`},网络效应:{explanation:`产品的使用价值会随着参与者增加而上升。社交软件属于同侧网络效应，用户越多越容易找到联系人；交易平台常是跨侧网络效应，更多买家吸引卖家，更多卖家又反过来吸引买家。`,scenario:`例如，一个二手交易平台最初只有500名买家和20名卖家，买家经常搜不到商品。平台先补贴卖家把供给增加到120家后，成交率从6%升到18%，更多成交又吸引了新买家，增长开始形成正向循环。`},基准率:{explanation:`判断某个个案属于一类事件的概率时，必须先看这类事件在总体中原本有多常见，再结合新证据更新判断。只看测试准确率或一个鲜活特征，会把罕见事件估得过高。`,scenario:`例如，某病在人群中的患病率为1%，检测对患者有95%的检出率，对健康人有5%的误报率。检测10,000人时约有95名真阳性和495名假阳性，因此一个阳性结果真正患病的概率只有约16%，而不是95%。`},要约与承诺:{explanation:`要约是内容足够明确、对方一旦接受即可成立合同的意思表示；承诺则是对该要约作出的有效同意。如果回复改变了价格、数量或期限，通常不是承诺，而是提出了新的条件。`,scenario:`例如，供应商邮件写明“100台设备，每台2,000元，8月30日前交付，本报价有效至周五”，买方周四回复“同意全部条件”。这组往来可能形成合同；若买方回复“接受，但每台改为1,800元”，则属于新的还价。`},荒诞主义:{summary:`世界未必给出答案，人仍可以认真生活。`,explanation:`荒诞来自人渴望终极意义与世界不提供确定回答之间的冲突。它不主张消极放弃，也不等于“一切都无所谓”，而是在看清冲突后仍选择行动并承担生活。`,scenario:`例如，小周失业后反复追问“这件事为什么偏偏发生在我身上”，却始终等不到终极解释。他不再把行动推迟到“想明白人生意义之后”，而是恢复作息、每天投递岗位，并完成一直想写的短篇小说；意义不是等来的答案，而是在这些选择中被创造出来。`}},ne=[...ee,...C].map(e=>({...e,...te[e.name]})),re=e((e=>{var t=Symbol.for(`react.transitional.element`);function n(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.jsx=n,e.jsxs=n})),w=e(((e,t)=>{t.exports=re()}))(),ie=e=>_.find(t=>t.name===e)?.color||`#c9ff3d`,ae=e=>e.replaceAll(`“`,`‘`).replaceAll(`”`,`’`);function oe(){let[e,t]=(0,l.useState)(`全部`),[n,r]=(0,l.useState)(ne[0]),[i,a]=(0,l.useState)(!1),[o,s]=(0,l.useState)(ne[0].name),[c,u]=(0,l.useState)(0),[d,f]=(0,l.useState)([]),[p,m]=(0,l.useState)([]),h=(0,l.useMemo)(()=>e===`全部`?ne:ne.filter(t=>t.category===e),[e]),g=_.slice(1),y=`conic-gradient(${g.map((e,t)=>`${e.color} ${t*(360/g.length)}deg ${(t+1)*(360/g.length)}deg`).join(`,`)})`;return(0,l.useEffect)(()=>{let e=localStorage.getItem(`cognition-wheel-favorites`);e&&m(JSON.parse(e))},[]),(0,w.jsxs)(`main`,{children:[(0,w.jsxs)(`header`,{className:`topbar`,children:[(0,w.jsxs)(`a`,{className:`brand`,href:`#top`,"aria-label":`认知转盘首页`,children:[(0,w.jsx)(`span`,{children:`COG`}),`认知转盘`]}),(0,w.jsxs)(`div`,{className:`top-meta`,children:[(0,w.jsx)(`span`,{children:`跨学科词库`}),(0,w.jsx)(`b`,{children:ne.length}),(0,w.jsx)(`span`,{children:`个深度词条 · 持续扩充至 1200+`})]}),(0,w.jsx)(`button`,{className:`roun
